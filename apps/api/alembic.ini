# Alembic configuration. The database URL is not set here: migrations/env.py reads
# DATABASE_ADMIN_URL from the environment, because migrations run as the owner role.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 60

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
